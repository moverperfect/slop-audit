name: CI

# Test suites for the Python reference analyzer and the Rust portable bundle.
# Push on every branch, and every pull request. Linux plus Windows, because this
# fork's analyzer is meant to run on both (suite start/stop, UTF-8 reads, vitest
# colour). macOS is left to the portable-bundle workflow, which already builds there.
on:
  push:
  pull_request:

jobs:
  python:
    name: L1 analyzer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows still runs and the log is the report. Its failures are the existing
    # suite, not this workflow, and they must not fail the workflow until those
    # tests are made Windows-safe in a later PR.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # GitHub's Windows runner uses a locale code page. Collection reads source as
      # that page unless Python is in UTF-8 mode, and one module then raises before
      # any test runs. Harmless on Linux, where UTF-8 is already the default.
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: tools/l1_analyzer
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: tools/l1_analyzer/uv.lock
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run test suite
        run: uv run pytest -q

  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tools/slop-audit-rs
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/slop-audit-rs
      - name: Run test suite
        run: cargo test --locked
